algorithm:
  name: sac
model:
  hidden_dim: 16
  num_layers: 2
  activation: relu
training:
  total_env_steps: 2000
  batch_size: 32
  replay_capacity: 10000
  warmup_steps: 200
  gradient_updates_per_step: 1
  collect_batch: 64
  gamma: 0.99
  tau: 0.005
  learning_rate: 0.003
  alpha: 1.0
  target_entropy: null
  ppo_epochs: 10
  ppo_clip_epsilon: 0.2
  ppo_entropy_coef: 0.01
  ppo_value_coef: 0.5
  gae_lambda: 0.95
  policy_sync_interval: 200
environment:
  split: train
  context_length: 8
  horizon: 16
  initial_balance: '10000'
  leverage: 50.0
  spread: 0.0002
  commission: 0.0
  sizing_mode: equity_fraction
  instruments:
  - EURUSD
compute:
  num_workers: 1
  learner_device: cpu
  torch_threads: 1
  collect_backend: sync
  seed: 42
logging:
  log_every_env_steps: 500
  evaluate_every_env_steps: 1000
  checkpoint_every_env_steps: 1000
  run_dir: runs_smoke
evaluation:
  validation_episodes: 2
  test_episodes: 2
  eval_horizon: 16
  eval_seed: 42
selection:
  metric: sharpe_drawdown
  lambda_drawdown: 1.0
run_id: ''
dataset_version: processed-parquet-2026
