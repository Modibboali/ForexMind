algorithm:
  name: ppo
model:
  hidden_dim: 256
  num_layers: 2
  activation: relu
training:
  total_env_steps: 200000
  batch_size: 256
  replay_capacity: 0
  warmup_steps: 0
  gradient_updates_per_step: 1
  collect_batch: 4096
  gamma: 0.99
  tau: 0.005
  learning_rate: 0.0003
  alpha: auto
  target_entropy: null
  ppo_epochs: 3
  ppo_clip_epsilon: 0.2
  ppo_entropy_coef: 0.01
  ppo_value_coef: 0.5
  gae_lambda: 0.95
  actor_lr: 0.0003
  critic_lr: 0.0003
  max_grad_norm: 0.5
  log_std_min: -5.0
  log_std_max: 2.0
  adv_epsilon: 1.0e-08
  finite_check: true
  ppo_target_kl: 0.02
  policy_sync_interval: 0
environment:
  split: train
  context_length: 64
  horizon: 512
  initial_balance: '10000'
  leverage: 50.0
  spread: 0.0002
  commission: 0.0
  sizing_mode: equity_fraction
  instruments: []
  min_reward: -50.0
  max_reward: null
compute:
  num_workers: auto
  learner_device: cpu
  torch_threads: 2
  torch_interop_threads: 2
  collect_backend: process
  dataset_backend: mmap
  memory_limit_fraction: 0.7
  seed: 1
logging:
  log_every_env_steps: 100000
  evaluate_every_env_steps: 500000
  checkpoint_every_env_steps: 500000
  run_dir: runs
evaluation:
  validation_episodes: 100
  test_episodes: 100
  eval_horizon: 512
  eval_seed: 42
selection:
  metric: sharpe_drawdown
  lambda_drawdown: 1.0
run_id: ppo_stable
dataset_version: processed-parquet-2026
